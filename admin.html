<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Multiplayer Tic-Tac-Toe</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin-page">
    <!-- Admin Login Modal -->
    <div id="adminLoginModal" class="modal">
        <div class="modal-content">
            <h2>Admin Login</h2>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminNickname">Admin Nickname</label>
                    <input type="text" id="adminNickname" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
                <button type="button" id="cancelAdminLogin" class="btn btn-secondary">Cancel</button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" style="display: none;">
        <div class="header">
            <h1>Admin Dashboard</h1>
            <div class="user-info">
                <span>Admin: <strong id="adminUsername"></strong></span>
                <button id="adminLogoutBtn" class="btn btn-small">Logout</button>
            </div>
        </div>

        <div class="admin-container">
            <div class="stats-section">
                <h2>Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="totalGames">0</div>
                        <div class="stat-label">Total Games</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalPlayers">0</div>
                        <div class="stat-label">Total Players</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="activeGames">0</div>
                        <div class="stat-label">Active Games</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="completedGames">0</div>
                        <div class="stat-label">Completed Games</div>
                    </div>
                </div>
            </div>

            <div class="results-section">
                <h2>All Game Results</h2>
                <div class="filters">
                    <button id="refreshBtn" class="btn btn-small">Refresh</button>
                </div>
                <div id="allResults" class="results-table-container">
                    <p class="loading">Loading results...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
