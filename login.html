<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Multiplayer Tic-Tac-Toe</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
    <div class="login-container">
        <h1>Multiplayer Tic-Tac-Toe</h1>

        <div class="mode-toggle">
            <button type="button" id="loginModeBtn" class="mode-btn active">Login</button>
            <button type="button" id="registerModeBtn" class="mode-btn">Register</button>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="nickname">Nickname</label>
                <input type="text" id="nickname" name="nickname" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <div class="form-group" id="confirmPasswordGroup" style="display: none;">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password">
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary">Login</button>
            <p class="info-text" id="infoText"></p>
        </form>

        <div class="admin-link">
            <a href="admin.html">Admin Login</a>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
